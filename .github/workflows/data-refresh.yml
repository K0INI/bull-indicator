name: Data refresh + publish
on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/data-refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: pipeline
        run: npm ci
      - name: Score-engine tests
        working-directory: pipeline
        run: npx vitest run
      - name: Refresh data (fails loudly; never emits partial data)
        working-directory: pipeline
        env:
          OUT_DIR: ${{ github.workspace }}/data
        run: npx tsx src/index.ts
      - name: Persist history to main
        run: |
          git config user.name "bull-indicator-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          git push
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
