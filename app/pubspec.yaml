name: bull_indicator
description: KŌINI Bull Indicator — read the cycle. Informational only.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/latest.json
    - assets/brand/
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost_200ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Jost_300Light.ttf
          weight: 300
        - asset: assets/fonts/Jost_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Jost_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Jost_600SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono_500Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0B0D"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
